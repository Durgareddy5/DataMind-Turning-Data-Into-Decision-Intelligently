server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routes: fall back to index.html for anything
    # that isn't a real static file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxies to the api service (Docker Compose's internal DNS) so the
    # browser only ever talks to this origin.
    location /api/ {
        proxy_pass http://api:5001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
